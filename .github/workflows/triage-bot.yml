# Added from shared-config: files/common/.github/workflows/triage-bot.yml
name: Triage Bot

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, assigned, unassigned]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without write operations'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # shared-config:block:start: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # shared-config:block:end: checkout
        with:
          fetch-depth: 0

      - name: Run triage action
        # shared-config:block:start: triage-bot
        uses: rafalmasiarek/gh-triage-bot@7af313905a9ba144be3d91662b5be7e1f28640ef # v1
        # shared-config:block:end: triage-bot
        with:
          config-path: .github/triage-rules.yml
          dry-run: ${{ github.event.inputs.dry_run || 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
