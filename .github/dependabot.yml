# Added from shared-config: files/common/.github/dependabot.yml.tpl

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
        - "dependencies"
        - "github-actions"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "php"
      - "composer"
    commit-message:
      prefix: "chore(deps)"
